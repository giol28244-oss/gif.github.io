<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Send Post</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: #0f0f0f;
            color: white;
            font-family: Arial;
            text-align: center;
        }
        button {
            margin-top: 50px;
            padding: 15px 30px;
            font-size: 18px;
            background: #2f80ff;
            color: white;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<h2>📤 Отправка поста</h2>
<button onclick="send()">Начать</button>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function send() {
        tg.sendData("start");
    }
</script>

</body>
</html>
