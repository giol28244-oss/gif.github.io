<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Fish Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: #0f0f0f;
            color: white;
            font-family: Arial;
            margin: 0;
            padding: 15px;
        }
        .card {
            background: #1c1c1c;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        button {
            width: 48%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .ok { background: #22c55e; }
        .bad { background: #ef4444; }
    </style>
</head>
<body>

<h2>🐟 Fish Moderator</h2>

<div id="list"></div>

<script>
const tg = Telegram.WebApp;
tg.ready();

fetch("https://YOUR-SERVER/get_requests")
.then(r => r.json())
.then(data => {
    const box = document.getElementById("list");
    data.forEach(item => {
        box.innerHTML += 
        <div class="card">
            <b>#${item.id}</b><br>
            ${item.desc}<br><br>
            <button class="ok" onclick="accept(${item.id})">Принять</button>
            <button class="bad" onclick="reject(${item.id})">Отклонить</button>
        </div>;
    });
});

function accept(id){
    fetch(/accept/${id});
    alert("Принято");
}

function reject(id){
    fetch(/reject/${id});
    alert("Отклонено");
}
</script>

</body>
</html>
