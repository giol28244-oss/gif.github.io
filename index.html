<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Fish Admin Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            background: #0f0f0f;
            color: white;
            font-family: Arial;
        }
        .box {
            padding: 20px;
        }
        .card {
            background: #1f1f1f;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        button {
            width: 100%;
            padding: 10px;
            border: none;
            background: #ff8800;
            color: black;
            font-weight: bold;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>🐟 Fish Panel</h2>

    <div class="card">
        <b>Панель работает</b><br>
        Mini App подключён ✅
    </div>

    <button onclick="Telegram.WebApp.close()">Закрыть</button>
</div>

<script>
    Telegram.WebApp.ready();
</script>

</body>
</html>
